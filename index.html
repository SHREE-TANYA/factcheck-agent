<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>FactCheck Agent</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#09090f;color:#e0dff0;min-height:100vh;padding:2.5rem 1.5rem}
.app{max-width:820px;margin:0 auto}
h1{font-family:'Syne',sans-serif;font-size:2.4rem;font-weight:800;color:#fff;text-align:center;letter-spacing:-1.5px;margin-bottom:.3rem}
h1 span{color:#7c5cfc}
.sub{text-align:center;font-family:'DM Mono',monospace;font-size:.8rem;color:#555;margin-bottom:2.5rem}
.upload-wrap{display:flex;flex-direction:column;align-items:center;gap:1rem;margin-bottom:1.5rem}
label.pick{display:inline-flex;align-items:center;gap:.6rem;background:#7c5cfc;color:#fff;font-family:'Syne',sans-serif;font-weight:700;font-size:1.05rem;padding:.9rem 2.5rem;border-radius:12px;cursor:pointer;transition:background .2s;user-select:none}
label.pick:hover{background:#6b4ef0}
label.pick input{display:none}
.file-info{font-family:'DM Mono',monospace;font-size:.82rem;color:#7c5cfc;background:#13101e;border:1px solid #2a2040;border-radius:8px;padding:.5rem 1.2rem;display:none;word-break:break-all;text-align:center;max-width:500px}
.run-btn{display:block;width:100%;max-width:500px;margin:.5rem auto 0;background:#1e1e2e;color:#7c5cfc;border:1.5px solid #7c5cfc;font-family:'Syne',sans-serif;font-weight:700;font-size:1rem;padding:.9rem;border-radius:12px;cursor:pointer;transition:all .2s}
.run-btn:hover:not(:disabled){background:#7c5cfc;color:#fff}
.run-btn:disabled{opacity:.3;cursor:not-allowed}
.status{font-family:'DM Mono',monospace;font-size:.78rem;color:#888;text-align:center;min-height:1.4rem;margin:.9rem 0}
.steps{display:none;justify-content:center;gap:.4rem;flex-wrap:wrap;margin-bottom:1.2rem}
.step{font-size:.7rem;font-family:'DM Mono',monospace;padding:.2rem .6rem;border-radius:5px;background:#1a1a28;color:#333;transition:all .3s}
.step.on{background:#1a1028;color:#7c5cfc}
.step.ok{background:#0d2018;color:#3ddc84}
.errbox{background:#1a0808;border:1px solid #4a1a1a;border-radius:10px;padding:.9rem 1.1rem;color:#f05050;font-family:'DM Mono',monospace;font-size:.8rem;margin:.8rem 0;display:none;line-height:1.6}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;margin-bottom:1.5rem}
.sc{background:#111118;border:1px solid #1e1e2e;border-radius:12px;padding:1rem;text-align:center}
.sn{font-family:'Syne',sans-serif;font-size:2rem;font-weight:800}
.sn.v{color:#3ddc84}.sn.i{color:#f0a030}.sn.f{color:#f05050}
.sl{font-size:.68rem;font-family:'DM Mono',monospace;color:#555;margin-top:.25rem}
.doc-prev{background:#0d0d15;border:1px solid #1e1e2e;border-radius:10px;padding:.85rem 1.1rem;margin-bottom:1.3rem;max-height:90px;overflow:hidden}
.dp-lbl{font-size:.68rem;font-family:'DM Mono',monospace;color:#444;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.35rem}
.dp-txt{font-size:.74rem;font-family:'DM Mono',monospace;color:#3a3a4a;line-height:1.5;white-space:pre-wrap}
.rpt-hdr{font-family:'Syne',sans-serif;font-size:1.15rem;font-weight:700;color:#fff;margin-bottom:.9rem;display:flex;align-items:center;gap:.5rem}
.rpt-badge{font-size:.68rem;font-family:'DM Mono',monospace;background:#1e1e2e;color:#888;padding:.2rem .6rem;border-radius:5px}
.card{background:#111118;border:1px solid #1e1e2e;border-radius:12px;padding:1.1rem;margin-bottom:.8rem}
.ctop{display:flex;gap:.65rem;align-items:flex-start;margin-bottom:.7rem}
.verd{font-family:'DM Mono',monospace;font-size:.7rem;padding:.27rem .65rem;border-radius:5px;white-space:nowrap;flex-shrink:0;margin-top:2px}
.vv{background:#0d2a1a;color:#3ddc84;border:1px solid #1a4a2e}
.vi{background:#2a1a00;color:#f0a030;border:1px solid #4a3000}
.vf{background:#2a0d0d;color:#f05050;border:1px solid #4a1a1a}
.ctxt{font-size:.88rem;color:#c8c8d8;line-height:1.55;flex:1}
.expl{font-size:.78rem;color:#666;font-family:'DM Mono',monospace;line-height:1.55;padding:.6rem .8rem;background:#0d0d15;border-radius:7px;border-left:2px solid #2a2a3a}
.expl.v{border-left-color:#3ddc84}.expl.i{border-left-color:#f0a030}.expl.f{border-left-color:#f05050}
.spinner{display:inline-block;width:10px;height:10px;border:2px solid #333;border-top-color:#7c5cfc;border-radius:50%;animation:spin .8s linear infinite;margin-right:.5rem;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.progress-bar{width:100%;max-width:500px;margin:.5rem auto;height:3px;background:#1e1e2e;border-radius:3px;overflow:hidden;display:none}
.progress-fill{height:100%;background:#7c5cfc;border-radius:3px;transition:width .4s ease;width:0}
#results{display:none}
</style>
</head>
<body>
<div class="app">
  <h1>Fact<span>Check</span> Agent</h1>
  <p class="sub">// upload PDF or TXT · AI extracts claims · live web verification</p>

  <div class="upload-wrap">
    <label class="pick">
      📂 Choose File from Device
      <input type="file" id="fileInput" accept=".pdf,.txt,.text"/>
    </label>
    <div class="file-info" id="fileInfo"></div>
  </div>

  <button class="run-btn" id="runBtn" disabled onclick="analyze()">🔍 Extract &amp; Verify Claims</button>
  <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="status" id="status"></div>
  <div class="steps" id="stepsRow">
    <div class="step" id="s1">1. read file</div>
    <div class="step" id="s2">2. extract claims</div>
    <div class="step" id="s3">3. web verify</div>
    <div class="step" id="s4">4. report</div>
  </div>
  <div class="errbox" id="errbox"></div>
  <div id="results"></div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let docText = '';
const fileInput = document.getElementById('fileInput');
const runBtn = document.getElementById('runBtn');
const fileInfo = document.getElementById('fileInfo');
const statusEl = document.getElementById('status');
const errbox = document.getElementById('errbox');
const progressBar = document.getElementById('progressBar');
const progressFill = document.getElementById('progressFill');

fileInput.addEventListener('change', async function() {
  const file = this.files[0];
  if (!file) return;
  errbox.style.display = 'none';
  document.getElementById('results').style.display = 'none';
  fileInfo.style.display = 'block';
  fileInfo.textContent = '📎 ' + file.name + ' (' + (file.size/1024).toFixed(1) + ' KB)';
  setStatus('Reading file...', true);
  runBtn.disabled = true;
  docText = '';
  try {
    if (file.name.toLowerCase().endsWith('.pdf')) {
      const ab = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({data: new Uint8Array(ab)}).promise;
      let t = '';
      for (let i = 1; i <= Math.min(pdf.numPages, 20); i++) {
        const pg = await pdf.getPage(i);
        const ct = await pg.getTextContent();
        t += ct.items.map(s => s.str).join(' ') + '\n';
      }
      docText = t.trim();
    } else {
      docText = await file.text();
    }
    if (!docText || docText.length < 20) { showErr('File appears empty or is a scanned image PDF. Try a text-based PDF or .txt file.'); return; }
    setStatus('✓ File loaded — ' + docText.length.toLocaleString() + ' characters. Ready to verify.', false);
    runBtn.disabled = false;
  } catch(e) { showErr('Could not read file: ' + e.message); }
});

function showErr(msg) {
  errbox.innerHTML = '⚠ ' + msg;
  errbox.style.display = 'block';
  setStatus('', false);
  runBtn.disabled = false;
  progressBar.style.display = 'none';
}
function setStatus(txt, loading) {
  statusEl.innerHTML = loading ? '<span class="spinner"></span>' + txt : txt;
}
function setStep(n) {
  document.getElementById('stepsRow').style.display = 'flex';
  for (let i = 1; i <= 4; i++) {
    document.getElementById('s' + i).className = 'step' + (i < n ? ' ok' : i === n ? ' on' : '');
  }
}
function setProgress(pct) {
  progressBar.style.display = 'block';
  progressFill.style.width = pct + '%';
}

async function analyze() {
  if (!docText) return;
  runBtn.disabled = true;
  errbox.style.display = 'none';
  document.getElementById('results').style.display = 'none';

  setStep(1); setProgress(10);
  setStatus('Sending document to Claude...', true);

  let claims = [];
  try {
    const r = await fetch('/api/extract', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text: docText})
    });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    claims = d.claims;
    if (!Array.isArray(claims) || !claims.length) throw new Error('No claims extracted');
  } catch(e) { showErr('Claim extraction failed: ' + e.message); return; }

  setStep(3);
  const verified = [];
  for (let i = 0; i < claims.length; i++) {
    setProgress(20 + Math.round((i / claims.length) * 70));
    setStatus('Verifying claim ' + (i+1) + ' of ' + claims.length + ': "' + claims[i].slice(0,55) + '..."', true);
    try {
      const r2 = await fetch('/api/verify', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({claim: claims[i]})
      });
      const d2 = await r2.json();
      if (d2.error) throw new Error(d2.error);
      verified.push({claim: claims[i], verdict: d2.verdict, explanation: d2.explanation});
    } catch(e) {
      verified.push({claim: claims[i], verdict: 'False', explanation: 'Verification error: ' + e.message});
    }
  }

  setProgress(100); setStep(4);
  setStatus('✓ Verification complete.', false);
  setTimeout(() => { progressBar.style.display = 'none'; }, 800);
  renderReport(verified, docText);
  runBtn.disabled = false;
}

function renderReport(items, preview) {
  const v = items.filter(c => c.verdict === 'Verified').length;
  const inc = items.filter(c => c.verdict === 'Inaccurate').length;
  const f = items.filter(c => c.verdict === 'False').length;
  let h = `
    <div class="summary">
      <div class="sc"><div class="sn v">${v}</div><div class="sl">✓ verified</div></div>
      <div class="sc"><div class="sn i">${inc}</div><div class="sl">⚠ inaccurate</div></div>
      <div class="sc"><div class="sn f">${f}</div><div class="sl">✗ false</div></div>
    </div>
    <div class="doc-prev"><div class="dp-lbl">document preview</div><div class="dp-txt">${preview.slice(0,350).replace(/</g,'&lt;')}${preview.length>350?'…':''}</div></div>
    <div class="rpt-hdr">Verification Report <span class="rpt-badge">${items.length} claims checked</span></div>
  `;
  for (const c of items) {
    const vc = c.verdict==='Verified'?'v':c.verdict==='Inaccurate'?'i':'f';
    const vs = c.verdict==='Verified'?'✓ Verified':c.verdict==='Inaccurate'?'⚠ Inaccurate':'✗ False';
    h += `<div class="card"><div class="ctop"><span class="verd v${vc}">${vs}</span><div class="ctxt">${c.claim.replace(/</g,'&lt;')}</div></div><div class="expl ${vc}">${c.explanation.replace(/</g,'&lt;')}</div></div>`;
  }
  const el = document.getElementById('results');
  el.innerHTML = h; el.style.display = 'block';
}
</script>
</body>
</html>
